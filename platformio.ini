; project configuration for autoparking-car, built with PlatformIO
; board: ESP32-S3-DevKitC-1 (chosen over C3 SuperMini: dual-core, more GPIO, more flash)
; board ID per the official PlatformIO docs:
; https://docs.platformio.org/en/latest/boards/espressif32/esp32-s3-devkitc-1.html
[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

; deep LDF scan so framework libs (Network) resolve for WebServer
lib_ldf_mode = chain+
build_flags = -Icontrol -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src

lib_deps =
    symlink://lib/Network
    madhephaestus/ESP32Servo
    pololu/VL53L0X
    mathieucarbou/AsyncTCP
    mathieucarbou/ESPAsyncWebServer
