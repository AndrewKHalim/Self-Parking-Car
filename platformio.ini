; project configuration for autoparking-car, built with PlatformIO
; board: ESP32-S3-DevKitC-1 N16R8 (16MB flash, 8MB octal PSRAM)
; board ID per the official PlatformIO docs:
; https://docs.platformio.org/en/latest/boards/espressif32/esp32-s3-devkitc1-n16r8.html
[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200

; deep LDF scan so framework libs (Network) resolve for WebServer
lib_ldf_mode = chain+
; pin the async tcp task to core 0 beside the wifi stack. the library defaults
; to letting freertos choose, which can put the http and websocket work on the
; control core. the n16r8 board definition sets the flash mode, the 16MB
; partition table and qio_opi memory itself. it leaves out the usb cdc mode
; that the generic board sets, so keep that one here.
build_flags =
    -Icontrol
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DARDUINO_USB_MODE=1

lib_deps =
    symlink://lib/Network
    madhephaestus/ESP32Servo@3.2.1
    pololu/VL53L0X@1.3.1
    mathieucarbou/AsyncTCP@3.3.2
    mathieucarbou/ESPAsyncWebServer@3.6.0
