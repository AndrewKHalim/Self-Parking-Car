; A separate project so the parking firmware and its environment are untouched.
; Same board, same partition table, same USB console. No libraries: the tests
; drive the motor inputs directly and include ../src/config.h for the pin map,
; the inversion flags and the sensor XSHUT lines.

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_build.partitions = max_app_4MB.csv
framework = arduino
monitor_speed = 115200

build_flags =
    -I../src
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Drives both motors forward from setup and keeps driving until power is cut.
[env:motor_test]
build_src_filter = +<main.cpp>

; Prints an I2C scan with the pins as wired, then again with SDA and SCL
; swapped, so the console says whether the bus is alive and which way round it is.
[env:i2c_scan]
build_src_filter = +<i2c_scan.cpp>

; Sweeps the steering servo from 45 to 135 degrees and back, forever, so the
; wheels can be watched moving through the whole range with nothing else running.
[env:servo_test]
build_src_filter = +<servo_test.cpp>
