; A separate project so the parking firmware and its environment are untouched.
; Same board, same partition table, same USB console. No libraries: the test
; drives the four motor inputs directly and includes control/config.h for the
; pin map and the inversion flags.

[env:motor_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_build.partitions = max_app_4MB.csv
framework = arduino
monitor_speed = 115200

build_flags =
    -I../control
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
