<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 732" width="980" height="732" font-family="'Latin Modern Roman', 'CMU Serif', Georgia, 'Times New Roman', serif" role="img"><rect x="0" y="0" width="980" height="732" fill="#ffffff"/><defs><marker id="sc-arw" viewBox="0 0 8 8" refX="7.6" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0.8 L 8 4 L 0 7.2 z" fill="#4d4d4d"/></marker></defs><text x="40.0" y="30.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="start">correction stroke: two halves, opposite lock, equal time</text><path d="M 120.0 330.0 L 120.4 325.5 L 121.5 321.0 L 123.2 316.5 L 125.6 312.0 L 128.6 307.5 L 132.2 303.0 L 136.2 298.5 L 140.8 294.0 L 145.8 289.5 L 151.2 285.0 L 157.1 280.5 L 163.2 276.0 L 169.6 271.5 L 176.3 267.0 L 183.3 262.5 L 190.4 258.0 L 197.7 253.5 L 205.1 249.0 L 212.5 244.5 L 220.0 240.0" fill="none" stroke="#0000bf" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 220.0 240.0 L 227.5 235.5 L 235.0 231.0 L 242.3 226.5 L 249.6 222.0 L 256.7 217.5 L 263.6 213.0 L 270.4 208.5 L 276.8 204.0 L 282.9 199.5 L 288.8 195.0 L 294.2 190.5 L 299.2 186.0 L 303.8 181.5 L 307.9 177.0 L 311.4 172.5 L 314.4 168.0 L 316.8 163.5 L 318.5 159.0 L 319.6 154.5 L 320.0 150.0" fill="none" stroke="#bf0000" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="316.8" y1="163.5" x2="320.0" y2="150.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#sc-arw)"/><rect x="100" y="300" width="40" height="60" rx="7" fill="none" stroke="#808080" stroke-width="1"/><rect x="300" y="120" width="40" height="60" rx="7" fill="none" stroke="#808080" stroke-width="1"/><text x="90.0" y="334.0" font-size="9.5" fill="#808080" font-weight="400" text-anchor="end">in</text><text x="350.0" y="154.0" font-size="9.5" fill="#808080" font-weight="400" text-anchor="start">out</text><line x1="120" y1="366" x2="320" y2="366" stroke="#808080" stroke-width="0.8" marker-start="url(#sc-arw)" marker-end="url(#sc-arw)"/><text x="220.0" y="382.0" font-size="9.5" fill="#808080" font-weight="400" text-anchor="middle">net shift</text><text x="40.0" y="308.0" font-size="9.5" fill="#0000bf" font-weight="400" text-anchor="start">half 1: +d</text><text x="258.0" y="188.0" font-size="9.5" fill="#bf0000" font-weight="400" text-anchor="end">half 2: −d</text><rect x="470.0" y="58" width="75.78947368421052" height="16" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="507.9" y="70.0" font-size="8.0" fill="#4d4d4d" font-weight="400" text-anchor="middle">STEER_WAIT</text><rect x="545.7894736842105" y="58" width="126.31578947368428" height="16" fill="#e8e8ff" stroke="#cccccc" stroke-width="0.8"/><text x="608.9" y="70.0" font-size="8.0" fill="#4d4d4d" font-weight="400" text-anchor="middle">FORWARD_CORRECT</text><rect x="545.7894736842105" y="104" width="126.31578947368428" height="54" fill="#e8e8ff" stroke="#cccccc" stroke-width="0.8"/><rect x="545.7894736842105" y="202" width="126.31578947368428" height="54" fill="#e8e8ff" stroke="#cccccc" stroke-width="0.8"/><rect x="545.7894736842105" y="300" width="126.31578947368428" height="54" fill="#e8e8ff" stroke="#cccccc" stroke-width="0.8"/><rect x="672.1052631578948" y="58" width="75.7894736842104" height="16" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="710.0" y="70.0" font-size="8.0" fill="#4d4d4d" font-weight="400" text-anchor="middle">STEER_COUNTER</text><rect x="747.8947368421052" y="58" width="126.31578947368428" height="16" fill="#ffe8e8" stroke="#cccccc" stroke-width="0.8"/><text x="811.1" y="70.0" font-size="8.0" fill="#4d4d4d" font-weight="400" text-anchor="middle">FORWARD_COUNTER</text><rect x="747.8947368421052" y="104" width="126.31578947368428" height="54" fill="#ffe8e8" stroke="#cccccc" stroke-width="0.8"/><rect x="747.8947368421052" y="202" width="126.31578947368428" height="54" fill="#ffe8e8" stroke="#cccccc" stroke-width="0.8"/><rect x="747.8947368421052" y="300" width="126.31578947368428" height="54" fill="#ffe8e8" stroke="#cccccc" stroke-width="0.8"/><rect x="874.2105263157895" y="58" width="75.78947368421052" height="16" fill="none" stroke="#cccccc" stroke-width="0.8"/><text x="912.1" y="70.0" font-size="8.0" fill="#4d4d4d" font-weight="400" text-anchor="middle">SETTLE</text><text x="470.0" y="98.0" font-size="10.5" fill="#000000" font-weight="400" text-anchor="start">wheel angle</text><rect x="470" y="104" width="480" height="54" fill="none" stroke="#cccccc" stroke-width="0.8"/><line x1="470" y1="131" x2="950" y2="131" stroke="#cccccc" stroke-dasharray="3 3"/><text x="464.0" y="114.0" font-size="9.5" fill="#808080" font-weight="400" text-anchor="end">+d</text><text x="464.0" y="135.0" font-size="9.5" fill="#808080" font-weight="400" text-anchor="end">0</text><text x="464.0" y="156.0" font-size="9.5" fill="#808080" font-weight="400" text-anchor="end">−d</text><text x="470.0" y="196.0" font-size="10.5" fill="#000000" font-weight="400" text-anchor="start">heading</text><rect x="470" y="202" width="480" height="54" fill="none" stroke="#cccccc" stroke-width="0.8"/><line x1="470" y1="229" x2="950" y2="229" stroke="#cccccc" stroke-dasharray="3 3"/><text x="464.0" y="212.0" font-size="9.5" fill="#808080" font-weight="400" text-anchor="end">θ</text><text x="464.0" y="233.0" font-size="9.5" fill="#808080" font-weight="400" text-anchor="end">0</text><text x="470.0" y="294.0" font-size="10.5" fill="#000000" font-weight="400" text-anchor="start">tail offset</text><rect x="470" y="300" width="480" height="54" fill="none" stroke="#cccccc" stroke-width="0.8"/><line x1="470" y1="327" x2="950" y2="327" stroke="#cccccc" stroke-dasharray="3 3"/><text x="464.0" y="310.0" font-size="9.5" fill="#808080" font-weight="400" text-anchor="end">Δ</text><text x="464.0" y="331.0" font-size="9.5" fill="#808080" font-weight="400" text-anchor="end">0</text><path d="M 470.0 131.0 L 545.8 109.0 L 672.1 109.0 L 747.9 153.0 L 874.2 153.0 L 950.0 131.0" fill="none" stroke="#0000bf" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M 470.0 229.0 L 545.8 229.0 L 672.1 207.0 L 747.9 207.0 L 874.2 229.0 L 950.0 229.0" fill="none" stroke="#0000bf" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="950.0" y="194.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="end">back to 0</text><path d="M 470.0 327.0 L 494.0 326.9 L 518.0 326.4 L 542.0 325.8 L 566.0 324.9 L 590.0 323.9 L 614.0 322.7 L 638.0 321.4 L 662.0 320.0 L 686.0 318.5 L 710.0 317.0" fill="none" stroke="#0000bf" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M 710.0 317.0 L 734.0 315.5 L 758.0 314.0 L 782.0 312.6 L 806.0 311.3 L 830.0 310.1 L 854.0 309.1 L 878.0 308.2 L 902.0 307.6 L 926.0 307.1 L 950.0 307.0" fill="none" stroke="#bf0000" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="950.0" y="292.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="end">shifted by Δ</text><text x="470.0" y="372.0" font-size="9.5" fill="#808080" font-weight="400" text-anchor="start">0 ms</text><text x="950.0" y="372.0" font-size="9.5" fill="#808080" font-weight="400" text-anchor="end">1900 ms</text><rect x="470" y="404" width="230" height="58" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="585.0" y="431.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">lateral fix</text><text x="585.0" y="447.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">first_w = +lat + ½yaw</text><rect x="720" y="404" width="240" height="58" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="840.0" y="431.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">yaw trim only</text><text x="840.0" y="447.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">wheel = Kyaw · yaw</text><rect x="470" y="486" width="230" height="58" fill="#ffe6e6" stroke="#e64545" stroke-width="1"/><text x="585.0" y="513.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">yaw ≥ 12 deg</text><text x="585.0" y="529.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">one arc, no mirror</text><line x1="40.0" y1="580" x2="321.3" y2="580" stroke="#cccccc" stroke-width="0.8"/><text x="40.0" y="595.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">1. STEER_WAIT is 300 ms with the motors braked, so the servo</text><text x="51.0" y="610.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">arrives before the car moves</text><text x="40.0" y="627.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">2. FORWARD_CORRECT is 500 ms at +d, half of</text><text x="51.0" y="642.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">forward_move_ms</text><text x="40.0" y="659.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">3. STEER_COUNTER is the same 300 ms while the servo swings</text><text x="51.0" y="674.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">to -d</text><text x="40.0" y="691.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">4. FORWARD_COUNTER is the other 500 ms at -d</text><line x1="349.3" y1="580" x2="630.7" y2="580" stroke="#cccccc" stroke-width="0.8"/><text x="349.3" y="595.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">5. SETTLE is SETTLE_FORWARD: 300 ms braked while the</text><text x="360.3" y="610.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">servo recentres</text><text x="349.3" y="627.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">6. d is the wheel angle the PID asks for, which the servo</text><text x="360.3" y="642.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">maps to 90 + 2.92 x d</text><text x="349.3" y="659.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">7. theta is the heading change that angle causes, and it</text><text x="360.3" y="674.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">returns to zero</text><text x="349.3" y="691.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">8. delta is the lateral shift, the integral of that heading</text><text x="360.3" y="706.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">over the same time</text><line x1="658.7" y1="580" x2="940.0" y2="580" stroke="#cccccc" stroke-width="0.8"/><text x="658.7" y="595.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">9. equal lock for equal time cancels the rotation, so heading</text><text x="669.7" y="610.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">out equals heading in</text><text x="658.7" y="627.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">10. the offset does not cancel: both halves push the tail the</text><text x="669.7" y="642.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">same way</text><text x="658.7" y="659.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">11. above 12 deg of yaw one straightening arc replaces the two</text><text x="669.7" y="674.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">halves</text><text x="658.7" y="691.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">12. the whole cycle is 1900 ms: 300 + 500 + 300 + 500 + 300</text></svg>
