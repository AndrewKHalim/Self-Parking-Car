x2="560" y2="1450" stroke="#cccccc" stroke-width="0.8"/><text x="40.0" y="1465.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">1. A and B are jump labels: the same letter joins the two ends</text><text x="40.0" y="1480.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">2. the dot where two wires join is an OR: either one continues</text><text x="40.0" y="1495.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">3. an early stop never parks: right gaps, wrong distance</text><text x="40.0" y="1510.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">4. a nudge that pulls past target + 25 mm re-enters REVERSE</text><text x="40.0" y="1525.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">5. the cap is a hard stop: backoff_limit faults out instead of nudging</text><text x="40.0" y="1540.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">6. the strokes themselves are in scurve.svg</text></svg>
