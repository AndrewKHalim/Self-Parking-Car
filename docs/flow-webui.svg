<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 675" width="980" height="675" font-family="'Latin Modern Roman', 'CMU Serif', Georgia, 'Times New Roman', serif" role="img"><rect x="0" y="0" width="980" height="675" fill="#ffffff"/><defs><marker id="webui-arw" viewBox="0 0 8 8" refX="7.6" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0.8 L 8 4 L 0 7.2 z" fill="#4d4d4d"/></marker></defs><text x="40.0" y="30.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="start">runtime: one task owns the car, one owns the network</text><text x="40.0" y="56.0" font-size="9.5" fill="#808080" font-weight="400" text-anchor="start">core 0</text><text x="380.0" y="56.0" font-size="9.5" fill="#808080" font-weight="400" text-anchor="start">shared</text><text x="660.0" y="56.0" font-size="9.5" fill="#808080" font-weight="400" text-anchor="start">core 1</text><path d="M 54 96 L 320 96 L 306 140 L 40 140 Z" fill="#fff0e0" stroke="#e6994d" stroke-width="1"/><text x="180.0" y="116.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">browser</text><text x="180.0" y="132.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">WebSocket, chart</text><rect x="40" y="176" width="280" height="58" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="180.0" y="203.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">HTTP handlers</text><text x="180.0" y="219.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">/ start stop config</text><rect x="40" y="336" width="280" height="58" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="180.0" y="363.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">publishTelemetry</text><text x="180.0" y="379.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">JSON, 10 Hz</text><rect x="380" y="176" width="220" height="58" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="490.0" y="203.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">atomic flags</text><text x="490.0" y="219.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">store only</text><rect x="380" y="336" width="220" height="58" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="490.0" y="363.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">Telemetry slot</text><text x="490.0" y="379.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">one slot, newest</text><rect x="660" y="80" width="280" height="44" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="800.0" y="106.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">exchange()</text><rect x="660" y="160" width="280" height="58" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="800.0" y="187.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">sensorBank.read()</text><text x="800.0" y="203.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">3 sensors, 30 Hz</text><rect x="660" y="254" width="280" height="58" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="800.0" y="281.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">apply requests</text><text x="800.0" y="297.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">stop wins, then start</text><rect x="660" y="348" width="280" height="44" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="800.0" y="374.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">machine.tick()</text><rect x="660" y="428" width="280" height="58" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="800.0" y="455.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">xQueueOverwrite</text><text x="800.0" y="471.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">slot, newest</text><rect x="660" y="522" width="280" height="44" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="800.0" y="548.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">delay 33 ms</text><line x1="180.0" y1="140.0" x2="180.0" y2="176.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#webui-arw)"/><line x1="320.0" y1="205.0" x2="380.0" y2="205.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#webui-arw)"/><text x="350.0" y="199.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">POST, GET</text><path d="M 600.0 205.0 L 630.0 205.0 L 630.0 102.0 L 660.0 102.0" fill="none" stroke="#4d4d4d" stroke-width="1" marker-end="url(#webui-arw)"/><text x="612.0" y="130.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">store</text><line x1="800.0" y1="124.0" x2="800.0" y2="160.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#webui-arw)"/><line x1="800.0" y1="218.0" x2="800.0" y2="254.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#webui-arw)"/><line x1="800.0" y1="312.0" x2="800.0" y2="348.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#webui-arw)"/><line x1="800.0" y1="392.0" x2="800.0" y2="428.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#webui-arw)"/><line x1="800.0" y1="486.0" x2="800.0" y2="522.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#webui-arw)"/><path d="M 660.0 457.0 L 630.0 457.0 L 630.0 365.0 L 600.0 365.0" fill="none" stroke="#4d4d4d" stroke-width="1" marker-end="url(#webui-arw)"/><text x="628.0" y="476.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">tick result</text><line x1="380.0" y1="365.0" x2="320.0" y2="365.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#webui-arw)"/><path d="M 40.0 365.0 L 20.0 365.0 L 20.0 118.0 L 40.0 118.0" fill="none" stroke="#4d4d4d" stroke-width="1" marker-end="url(#webui-arw)"/><text x="24.0" y="250.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">push</text><path d="M 940.0 544.0 L 966.0 544.0 L 966.0 74.0 L 800.0 74.0 L 800.0 80.0" fill="none" stroke="#4d4d4d" stroke-width="1" marker-end="url(#webui-arw)"/><text x="912.0" y="508.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">30 Hz</text><line x1="40.0" y1="600" x2="476.0" y2="600" stroke="#cccccc" stroke-width="0.8"/><text x="40.0" y="615.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">1. handlers only store a flag; the control task applies it next tick</text><text x="40.0" y="632.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">2. the slot carries a copy, never a half-written state</text><text x="40.0" y="649.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">3. stop is applied before start, so an abort is never swallowed</text><line x1="504.0" y1="600" x2="940.0" y2="600" stroke="#cccccc" stroke-width="0.8"/><text x="504.0" y="615.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">4. 33 ms is the control period at 30 Hz; the page is fed every 100 ms, 10 Hz</text><text x="504.0" y="632.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">5. the car is its own access point, so the page needs no router and no credentials</text></svg>
