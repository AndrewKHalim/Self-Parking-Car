<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 452" width="980" height="452" font-family="'Latin Modern Roman', 'CMU Serif', Georgia, 'Times New Roman', serif" role="img"><rect x="0" y="0" width="980" height="452" fill="#ffffff"/><defs><marker id="pid-arw" viewBox="0 0 8 8" refX="7.6" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0.8 L 8 4 L 0 7.2 z" fill="#4d4d4d"/></marker></defs><text x="40.0" y="30.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="start">the lateral PID as a loop: the offset goes in, the servo angle comes out</text><rect x="40" y="104" width="160" height="44" rx="22.0" fill="#e6e6e6" stroke="#4d4d4d" stroke-width="1"/><text x="120.0" y="124.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">set point</text><text x="120.0" y="140.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">offset 0 mm</text><circle cx="245" cy="126" r="18" fill="#ffffff" stroke="#4d4d4d" stroke-width="1"/><text x="245.0" y="131.0" font-size="14" fill="#000000" font-weight="400" text-anchor="middle">Σ</text><text x="259.0" y="140.0" font-size="13" fill="#4d4d4d" font-weight="400" text-anchor="start">−</text><rect x="300" y="92" width="230" height="68" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="415.0" y="124.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">LateralPID</text><text x="415.0" y="140.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">Kp·e + Ki∫e + Kd·de, ±15.4°</text><rect x="550" y="92" width="230" height="68" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="665.0" y="124.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">setWheelAngleDeg</text><text x="665.0" y="140.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">servo = 90 + 2.92·wheel</text><rect x="600" y="190" width="280" height="64" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="740.0" y="220.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">chassis</text><text x="740.0" y="236.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">servo held for 500 ms</text><rect x="330" y="190" width="250" height="64" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="455.0" y="220.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">VL53L0X</text><text x="455.0" y="236.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">gL, gR after the move</text><rect x="60" y="190" width="250" height="64" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="185.0" y="220.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">corr_diff_mm</text><text x="185.0" y="236.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">gL − gR − 56·tan psi</text><line x1="200.0" y1="126.0" x2="227.0" y2="126.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#pid-arw)"/><text x="262.0" y="114.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">e</text><line x1="263.0" y1="126.0" x2="300.0" y2="126.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#pid-arw)"/><line x1="530.0" y1="126.0" x2="550.0" y2="126.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#pid-arw)"/><line x1="780.0" y1="126.0" x2="900.0" y2="126.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#pid-arw)"/><text x="846.0" y="114.0" font-size="10.5" fill="#000000" font-weight="400" text-anchor="middle">u: servo angle</text><text x="878.0" y="148.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="end">output</text><path d="M 900.0 128.0 L 900.0 222.0 L 882.0 222.0" fill="none" stroke="#4d4d4d" stroke-width="1" marker-end="url(#pid-arw)"/><line x1="600.0" y1="222.0" x2="580.0" y2="222.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#pid-arw)"/><line x1="330.0" y1="222.0" x2="310.0" y2="222.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#pid-arw)"/><path d="M 60.0 222.0 L 36.0 222.0 L 36.0 160.0 L 245.0 160.0 L 245.0 146.0" fill="none" stroke="#4d4d4d" stroke-width="1" marker-end="url(#pid-arw)"/><text x="150.0" y="154.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">y</text><line x1="40.0" y1="300" x2="321.3" y2="300" stroke="#cccccc" stroke-width="0.8"/><text x="40.0" y="315.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">1. the set point is 0 mm because the tail belongs centred</text><text x="51.0" y="330.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">between the gaps</text><text x="40.0" y="347.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">2. e is 0 minus y, and y is the offset the sensors report</text><text x="51.0" y="362.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">after the move</text><text x="40.0" y="379.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">3. the block runs once per cycle, on a braked chassis, never</text><text x="51.0" y="394.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">while it rolls</text><text x="40.0" y="411.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">4. Kp 0.15 deg per mm, Ki 0.01 per mm-second, Kd 0.02 per</text><text x="51.0" y="426.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">mm/s, all set from the page</text><line x1="349.3" y1="300" x2="630.7" y2="300" stroke="#cccccc" stroke-width="0.8"/><text x="349.3" y="315.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">5. 15.4 deg is the mechanical stop of the road wheel, so the</text><text x="360.3" y="330.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">sum clamps there</text><text x="349.3" y="347.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">6. the integral is capped at 5 deg of wheel, which keeps it</text><text x="360.3" y="362.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">from winding up while stuck</text><text x="349.3" y="379.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">7. 2.92 is servo degrees per wheel degree: pinion, rack pitch</text><text x="360.3" y="394.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">and horn multiply it</text><text x="349.3" y="411.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">8. 90 is the centred servo, so servo = 90 + 2.92 x wheel, and</text><text x="360.3" y="426.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">the travel is 45 to 135</text><line x1="658.7" y1="300" x2="940.0" y2="300" stroke="#cccccc" stroke-width="0.8"/><text x="658.7" y="315.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">9. 56 mm is the stagger coefficient: the side sensors sit 80</text><text x="669.7" y="330.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">mm apart along the body</text><text x="658.7" y="347.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">10. that 80 mm means gL minus gR carries heading as well, and</text><text x="669.7" y="362.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">56 removes that term</text><text x="658.7" y="379.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">11. 500 ms is half of the 1000 ms forward stroke, the time the</text><text x="669.7" y="394.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">angle is held</text><text x="658.7" y="411.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">12. 33 ms is the control period, 30 Hz, and the gaps are read</text><text x="669.7" y="426.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">on that tick</text></svg>
