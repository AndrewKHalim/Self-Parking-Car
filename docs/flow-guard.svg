<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1100" width="980" height="1100" font-family="'Latin Modern Roman', 'CMU Serif', Georgia, 'Times New Roman', serif" role="img"><rect x="0" y="0" width="980" height="1100" fill="#ffffff"/><defs><marker id="guard-arw" viewBox="0 0 8 8" refX="7.6" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0.8 L 8 4 L 0 7.2 z" fill="#4d4d4d"/></marker></defs><text x="40.0" y="30.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="start">reverse-leg guard: four checks, in this order</text><rect x="325" y="64" width="150" height="44" rx="22.0" fill="#e6e6e6" stroke="#4d4d4d" stroke-width="1"/><text x="400.0" y="84.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">tick()</text><text x="400.0" y="100.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">33 ms</text><rect x="250" y="132" width="300" height="48" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="400.0" y="154.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">latch the anchor</text><text x="400.0" y="170.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">recordReverseStart, once per leg</text><path d="M 400 202.0 L 525.0 244 L 400 286.0 L 275.0 244 Z" fill="#ffe6e6" stroke="#e64545" stroke-width="1"/><text x="400.0" y="248.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">rear ≤ target + 15?</text><path d="M 400 334.0 L 525.0 376 L 400 418.0 L 275.0 376 Z" fill="#ffe6e6" stroke="#e64545" stroke-width="1"/><text x="400.0" y="380.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">elapsed ≥ 350 ms?</text><rect x="250" y="432" width="300" height="58" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="400.0" y="459.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">live tan psi</text><text x="400.0" y="475.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">once moved ≥ 15 mm</text><rect x="250" y="518" width="300" height="58" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="400.0" y="545.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">project each tire</text><text x="400.0" y="561.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">gap − 37.5 − lever·psi</text><path d="M 400 604.0 L 535.0 646 L 400 688.0 L 265.0 646 Z" fill="#ffe6e6" stroke="#e64545" stroke-width="1"/><text x="400.0" y="650.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">clear ≤ 17.5, closing?</text><path d="M 400 736.0 L 535.0 778 L 400 820.0 L 265.0 778 Z" fill="#ffe6e6" stroke="#e64545" stroke-width="1"/><text x="400.0" y="782.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">8 mm in 700 ms?</text><path d="M 400 868.0 L 515.0 910 L 400 952.0 L 285.0 910 Z" fill="#ffe6e6" stroke="#e64545" stroke-width="1"/><text x="400.0" y="914.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">6000 ms?</text><rect x="325" y="968" width="150" height="40" rx="20.0" fill="#e6e6e6" stroke="#4d4d4d" stroke-width="1"/><text x="400.0" y="992.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">next tick</text><rect x="700" y="220" width="220" height="48" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="810.0" y="242.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">brake</text><text x="810.0" y="258.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">→ SETTLE_REAR</text><rect x="700" y="622" width="220" height="48" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="810.0" y="644.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">brake, early stop</text><text x="810.0" y="660.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">→ SETTLE_REAR</text><rect x="700" y="754" width="220" height="48" fill="#e6e6ff" stroke="#6666ff" stroke-width="1"/><text x="810.0" y="776.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">unstick ≥ 9.5°</text><text x="810.0" y="792.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">→ correction stroke</text><rect x="700" y="886" width="220" height="48" fill="#ffcccc" stroke="#cc0000" stroke-width="1"/><text x="810.0" y="908.0" font-size="12.0" fill="#000000" font-weight="400" text-anchor="middle">rev_timeout</text><text x="810.0" y="924.0" font-size="10.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">FAULT</text><line x1="400.0" y1="108.0" x2="400.0" y2="132.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#guard-arw)"/><line x1="400.0" y1="180.0" x2="400.0" y2="202.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#guard-arw)"/><line x1="525.0" y1="244.0" x2="700.0" y2="244.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#guard-arw)"/><text x="612.5" y="238.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">yes</text><line x1="400.0" y1="286.0" x2="400.0" y2="334.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#guard-arw)"/><text x="420.0" y="310.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">no</text><line x1="400.0" y1="418.0" x2="400.0" y2="432.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#guard-arw)"/><text x="426.0" y="425.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">yes</text><line x1="400.0" y1="490.0" x2="400.0" y2="518.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#guard-arw)"/><line x1="400.0" y1="576.0" x2="400.0" y2="604.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#guard-arw)"/><line x1="535.0" y1="646.0" x2="700.0" y2="646.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#guard-arw)"/><text x="617.5" y="640.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">yes</text><line x1="400.0" y1="688.0" x2="400.0" y2="736.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#guard-arw)"/><text x="420.0" y="712.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">no</text><line x1="535.0" y1="778.0" x2="700.0" y2="778.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#guard-arw)"/><text x="617.5" y="772.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">yes</text><line x1="400.0" y1="820.0" x2="400.0" y2="868.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#guard-arw)"/><text x="420.0" y="844.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">no</text><line x1="515.0" y1="910.0" x2="700.0" y2="910.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#guard-arw)"/><text x="607.5" y="904.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">yes</text><line x1="400.0" y1="952.0" x2="400.0" y2="968.0" stroke="#4d4d4d" stroke-width="1" marker-end="url(#guard-arw)"/><text x="420.0" y="960.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="middle">no</text><path d="M 275.0 376.0 L 180.0 376.0 L 180.0 778.0 L 265.0 778.0" fill="none" stroke="#4d4d4d" stroke-width="1" marker-end="url(#guard-arw)"/><text x="186.0" y="560.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">no</text><path d="M 325.0 988.0 L 60.0 988.0 L 60.0 86.0 L 325.0 86.0" fill="none" stroke="#4d4d4d" stroke-width="1" marker-end="url(#guard-arw)"/><text x="66.0" y="520.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">next tick</text><line x1="40" y1="1024" x2="500" y2="1024" stroke="#cccccc" stroke-width="0.8"/><text x="40.0" y="1039.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">1. the lead check is first: the brake has to beat the 10-15 mm coast</text><text x="40.0" y="1054.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">2. the side guard is skipped until the car has driven 15 mm</text><text x="40.0" y="1069.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">3. 17.5 mm at the tire is 55 mm at the sensor when psi is 0</text><text x="40.0" y="1084.0" font-size="9.5" fill="#4d4d4d" font-weight="400" text-anchor="start">4. under 8 mm of travel in 700 ms means a wheel is hung on a wall</text></svg>
