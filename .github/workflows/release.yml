name: release

# The tag is the release. The factory image is committed under releases/, so
# the runner publishes it instead of building it.
on:
  push:
    tags: ["hw-*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish the factory image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            releases/autoparking.factory.bin \
            --title "Build $GITHUB_REF_NAME" \
            --notes "Ready-to-flash image for the ESP32-S3 Super Mini, written at 0x0 with esptool. Built from commit $GITHUB_SHA."
