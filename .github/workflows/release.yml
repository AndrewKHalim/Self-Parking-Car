name: release

# A tag is the release. The binaries are committed under releases/, so the
# runner only has to publish them and does not build anything.
on:
  push:
    tags: ["hw-*", "bench-*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish the factory images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The asset list is explicit on purpose, so a tag publishes only what
          # was asked for. A new bench image must be added here before a tag can
          # publish it. motor_test is never published because it drives the car
          # the moment the board is powered.
          gh release create "$GITHUB_REF_NAME" \
            releases/autoparking.factory.bin \
            releases/servo_test.factory.bin \
            --title "Build $GITHUB_REF_NAME" \
            --notes "Ready-to-flash images for the ESP32-S3 Super Mini, both written at 0x0 with esptool. autoparking.factory.bin is the parking firmware. servo_test.factory.bin sweeps the steering servo left and right continuously, for bench checks of the steering only. Built from commit $GITHUB_SHA."
