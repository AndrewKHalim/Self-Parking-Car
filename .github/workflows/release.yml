name: release

# A tag is the release. The binaries are committed under releases/, so the
# runner only has to publish them and does not build anything.
on:
  push:
    tags: ["hw-*", "bench-*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish the factory images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" releases/*.bin \
            --title "Build $GITHUB_REF_NAME" \
            --notes "Ready-to-flash images for the ESP32-S3 Super Mini, both written at 0x0 with esptool. autoparking.factory.bin is the parking firmware, motor_test.factory.bin is the bench drive copy that moves the car as soon as it is powered. Built from commit $GITHUB_SHA."
