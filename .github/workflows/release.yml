name: release

# A tag is the release. The binary is committed under releases/, so the runner
# only has to publish it and does not build anything.
on:
  push:
    tags: ["hw-*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The asset list is explicit on purpose. The tree also carries the bench
      # images, and a release must ship exactly one file, the application
      # factory image, so nothing here globs releases/.
      - name: Publish the factory image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" releases/autoparking.factory.bin \
            --title "Build $GITHUB_REF_NAME" \
            --notes "Ready-to-flash image for the ESP32-S3 Super Mini, written at 0x0 with esptool. autoparking.factory.bin is the parking firmware: it calibrates the bay width at the start of the run, then reverses at duty 200 under a cascade PID on lateral offset and heading, with a rear stop at 90 mm, a side guard under 25 mm, a 300 ms brake, and a dashboard showing x, psi and the servo command. Built from commit $GITHUB_SHA."
